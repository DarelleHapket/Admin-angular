<div>
  <a href="/admin/products"> retour </a>
</div>
<div class="container mt-5">
  <h2>Créer un produit</h2>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="name" class="form-label">Nom</label>
      <input type="text" id="name" class="form-control" formControlName="name">
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea id="description" class="form-control" formControlName="description"></textarea>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label for="price" class="form-label">Prix</label>
        <input type="number" id="price" class="form-control" formControlName="price">
      </div>
      <div class="col-md-4 mb-3">
        <label for="quantity" class="form-label">Quantité</label>
        <input type="number" id="quantity" class="form-control" formControlName="quantity">
      </div>
      <div class="col-md-4 mb-3">
        <label for="rating" class="form-label">Note (0-5)</label>
        <input type="number" id="rating" class="form-control" formControlName="rating" min="0" max="5">
      </div>
    </div>

    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="is_active" formControlName="is_active">
      <label class="form-check-label" for="is_active">Actif</label>
    </div>
 
    <!-- Exemple de sélection de catégories (checkboxes) -->
    <div class="mb-3">
      <label class="form-label">Catégories</label>
      <div class="d-flex flex-wrap gap-3">
        <div class="form-check" *ngFor="let cat of categories">
          <input class="form-check-input" type="checkbox" [id]="'cat-' + cat.id"
            (change)="toggleCategory(cat.id, $event)">
          <label class="form-check-label" [for]="'cat-' + cat.id">
            {{ cat.name }}
          </label>
        </div>
      </div>
    </div>

    <div class="mb-3">
      <label for="images" class="form-label">Images (plusieurs)</label>
      <input type="file" id="images" class="form-control" multiple accept="image/*" (change)="onFileChange($event)">
    </div>

    <!-- Aperçu des images -->
    <div class="row mb-3" *ngIf="previewImages.length > 0">
      <h5>Aperçu des images</h5>
      <div class="col-md-3 mb-3" *ngFor="let img of previewImages; let i = index">
        <img [src]="img.url" class="img-thumbnail" alt="Preview">
        <button type="button" class="btn btn-danger btn-sm mt-2" (click)="removeImage(i)">Supprimer</button>
      </div>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid || previewImages.length === 0">
      Créer le produit
    </button>
  </form>
</div>
