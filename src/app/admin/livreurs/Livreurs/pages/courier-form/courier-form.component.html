<div class="page-container">

  <!-- Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">
        <svg class="title-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
        Nouveau Livreur
      </h1>
      <p class="page-subtitle">Ajouter un nouveau livreur à l'équipe</p>
    </div>
    <button class="btn-back" routerLink="/admin/couriers">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Retour à la liste
    </button>
  </div>

  <!-- Formulaire -->
  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-grid">
        <!-- Prénom -->
        <div class="form-group">
          <label for="first_name">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Prénom
            <span class="required">*</span>
          </label>
          <input
            id="first_name"
            type="text"
            placeholder="Ex: Jean"
            formControlName="first_name"
            class="form-input"
            [class.input-error]="form.get('first_name')?.invalid && form.get('first_name')?.touched"
          />
          <span class="error-text" *ngIf="form.get('first_name')?.invalid && form.get('first_name')?.touched">
            Le prénom est obligatoire
          </span>
        </div>

        <!-- Nom -->
        <div class="form-group">
          <label for="last_name">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Nom
            <span class="required">*</span>
          </label>
          <input
            id="last_name"
            type="text"
            placeholder="Ex: Dupont"
            formControlName="last_name"
            class="form-input"
            [class.input-error]="form.get('last_name')?.invalid && form.get('last_name')?.touched"
          />
          <span class="error-text" *ngIf="form.get('last_name')?.invalid && form.get('last_name')?.touched">
            Le nom est obligatoire
          </span>
        </div>

        <!-- Téléphone -->
        <div class="form-group">
          <label for="phone">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
            </svg>
            Téléphone
            <span class="required">*</span>
          </label>
          <input
            id="phone"
            type="tel"
            placeholder="Ex: +237 6 XX XX XX XX"
            formControlName="phone"
            class="form-input"
            [class.input-error]="form.get('phone')?.invalid && form.get('phone')?.touched"
          />
          <span class="error-text" *ngIf="form.get('phone')?.invalid && form.get('phone')?.touched">
            Le téléphone est obligatoire
          </span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            Email
            <span class="required">*</span>
          </label>
          <input
            id="email"
            type="email"
            placeholder="Ex: jean.dupont@email.com"
            formControlName="email"
            class="form-input"
            [class.input-error]="form.get('email')?.invalid && form.get('email')?.touched"
          />
          <span class="error-text" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            Email invalide
          </span>
        </div>

        <!-- Mot de passe -->
        <div class="form-group">
          <label for="password">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            Mot de passe
            <span class="required">*</span>
          </label>
          <input
            id="password"
            type="password"
            placeholder="Minimum 8 caractères"
            formControlName="password"
            class="form-input"
            [class.input-error]="form.get('password')?.invalid && form.get('password')?.touched"
          />
          <span class="error-text" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
            Minimum 8 caractères
          </span>
        </div>

        <!-- Confirmation mot de passe -->
        <div class="form-group">
          <label for="password_confirmation">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Confirmer le mot de passe
            <span class="required">*</span>
          </label>
          <input
            id="password_confirmation"
            type="password"
            placeholder="Retapez le mot de passe"
            formControlName="password_confirmation"
            class="form-input"
            [class.input-error]="form.get('password_confirmation')?.invalid && form.get('password_confirmation')?.touched"
          />
          <span class="error-text" *ngIf="form.get('password_confirmation')?.invalid && form.get('password_confirmation')?.touched">
            Les mots de passe ne correspondent pas
          </span>
        </div>
      </div>

      <!-- Message d'erreur global -->
      <div *ngIf="errorMessage" class="error-message">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ errorMessage }}
      </div>

      <!-- Boutons -->
      <div class="form-actions">
        <button type="button" class="btn-cancel" routerLink="/admin/couriers">
          Annuler
        </button>
        <button type="submit" class="btn-submit" [disabled]="form.invalid || loading">
          <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
          <div *ngIf="loading" class="spinner-small"></div>
          {{ loading ? 'Création en cours...' : 'Créer le livreur' }}
        </button>
      </div>

    </form>
  </div>

</div>
