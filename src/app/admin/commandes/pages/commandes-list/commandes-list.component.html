<div class="page-container">
  <h1 class="page-title">Gestion des Commandes</h1>

  <!-- Filtres -->
  <div class="filters">
    <input type="date" [(ngModel)]="filterDate" (change)="applyFilters()">

    <select [(ngModel)]="filterStatus" (change)="applyFilters()">
      <option value="">Tous les statuts</option>
      <option *ngFor="let entry of statusEntries" [value]="entry.key">
        {{ entry.value }}
      </option>
    </select>
  </div>

  <!-- Tableau -->
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Client</th>
        <th>Date</th>
        <th>Montant</th>
        <th>Livreur</th>
        <th>Statut</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngIf="filteredOrders.length === 0">
        <td colspan="7">Aucune commande trouvée</td>
      </tr>

      <tr *ngFor="let order of filteredOrders">
        <td>{{ order.id }}</td>
        <td>{{ order.cart?.user?.name || '—' }}</td>
        <td>{{ formatOrderDate(order) | date:'short' }}</td>
        <td>{{ order.total_amount }} FCFA</td>

        <!-- Colonne Livreur -->
        <td>
          <select [(ngModel)]="order.livreur_id" (change)="updateCourier(order)" [disabled]="!livreur.length">
            <option [ngValue]="null">Aucun livreur</option>
            <option *ngFor="let c of livreur" [ngValue]="c.id">
              {{ c.name }}
            </option>
          </select>
        </td>

        <!-- Colonne Statut -->
        <td>
          <select [(ngModel)]="order.status" (change)="updateStatus(order)">
            <option *ngFor="let entry of statusEntries" [value]="entry.key">
              {{ entry.value }}
            </option>
          </select>
        </td>

        <td>
          <button class="btn-primary" (click)="viewDetails(order)">
            Détails
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
