<div class="page-container">
  <h1 class="page-title">Gestion des Commandes</h1>

  <!-- Filtres -->
  <div class="filters">
    <input
      type="date"
      [(ngModel)]="filterDate"
      (change)="applyFilters()"
    >

    <select [(ngModel)]="filterStatus" (change)="applyFilters()">
      <option value="">Tous les statuts</option>
      <option value="RESERVE">Réservée</option>
      <option value="A_LIVRER">À livrer</option>
      <option value="LIVREE">Livrée</option>
      <option value="ECHEC">Échec</option>
    </select>
  </div>

  <!-- Tableau -->
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Client</th>
        <th>Date</th>
        <th>Montant</th>
        <th>Statut</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngIf="filteredOrders.length === 0">
        <td colspan="6">Aucune commande trouvée</td>
      </tr>

      <tr *ngFor="let order of filteredOrders">
        <td>{{ order.id }}</td>
        <td>{{ order.client || '—' }}</td>
        <td>{{ order.created_at | date:'short' }}</td>
        <td>{{ order.total_amount }} FCFA</td>

        <td>
          <select [(ngModel)]="order.status" (change)="updateStatus(order)">
            <option value="RESERVE">Réservée</option>
            <option value="A_LIVRER">À livrer</option>
            <option value="LIVREE">Livrée</option>
            <option value="ECHEC">Échec</option>
          </select>
        </td>

        <td>
          <button class="btn-primary" (click)="viewDetails(order)">
            Détails
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
